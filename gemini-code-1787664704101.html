<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cobra TV Live - Control Center</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-black: #050505;
            --card-black: #0f172a;
            --pink-main: #ec4899;
            --wine-red: #881337;
            --wine-dark: #4c0519;
            --text-light: #f8fafc;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-black); color: var(--text-light); padding: 15px; direction: rtl; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: linear-gradient(135deg, var(--wine-dark), var(--card-black)); border: 1px solid var(--pink-main); border-radius: 10px; margin-bottom: 15px; }
        .logo-text { font-size: 22px; font-weight: bold; color: var(--pink-main); }

        .grid-main { display: grid; grid-template-columns: 2fr 1fr; gap: 15px; }
        @media (max-width: 850px) { .grid-main { grid-template-columns: 1fr; } }

        .card { background: var(--card-black); border-radius: 10px; padding: 15px; border: 1px solid #334155; margin-bottom: 15px; }
        .card-wine { border-color: var(--wine-red); background: linear-gradient(180deg, var(--card-black), var(--wine-dark)); }
        .card-title { font-size: 16px; font-weight: bold; color: var(--pink-main); margin-bottom: 12px; }

        /* Video Container with Pixel Positioning Overlay Logo */
        .player-wrapper { position: relative; width: 100%; background: #000; border-radius: 8px; overflow: hidden; border: 2px solid var(--pink-main); }
        video { width: 100%; height: 340px; object-fit: contain; }
        
        #overlayLogo {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 80px;
            z-index: 99;
            pointer-events: none;
        }

        /* Controls Grid */
        .controls-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 8px; text-align: center; }
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; background: #050505; border: 1px solid #475569; color: #fff; border-radius: 5px; margin-bottom: 8px; font-size: 13px; }
        label { font-size: 12px; color: #cbd5e1; margin-bottom: 2px; display: block; }

        .btn { border: none; border-radius: 5px; padding: 8px 12px; font-weight: bold; cursor: pointer; color: white; width: 100%; margin-bottom: 6px; font-size: 13px; }
        .btn-pink { background: var(--pink-main); }
        .btn-wine { background: var(--wine-red); }
        .btn-dark { background: #334155; }

        .playlist-box { max-height: 220px; overflow-y: auto; list-style: none; }
        .playlist-item { background: #050505; padding: 8px 10px; border-radius: 5px; border: 1px solid #334155; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .active-movie { border-color: var(--pink-main); background: #1e1b4b; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo-text">🐍 Cobra TV - البث الحي والمباشر</div>
        <div style="font-size:12px; color:#4ade80;" id="statusBadge">● السيرفر متصل</div>
    </div>

    <div class="grid-main">
        <div>
            <!-- شاشة البث الحي مع التحكم الدقيق باللوجو -->
            <div class="card">
                <div class="card-title">🎬 شاشة العرض الحية (Live Stream)</div>
                <div class="player-wrapper">
                    <img id="overlayLogo" src="https://via.placeholder.com/80/ec4899/ffffff?text=Cobra" alt="Logo">
                    <video id="liveVideo" controls></video>
                </div>
                <div style="margin-top:8px; font-size:13px; color:#ec4899;" id="nowPlayingText">جاري الانتظار...</div>
            </div>

            <!-- التحكم باللوجو بالأسهم والبكسل -->
            <div class="card">
                <div class="card-title">🎯 ضبط مكان اللوجو بالأسهم والبكسل (لتغطية أي حقوق)</div>
                <label>رابط صورة اللوجو:</label>
                <input type="text" id="logoUrl" value="https://via.placeholder.com/80/ec4899/ffffff?text=Cobra" onchange="updateLogo()">

                <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
                    <div>
                        <label>من الأعلى (Top px):</label>
                        <input type="number" id="logoTop" value="10" oninput="updateLogo()">
                    </div>
                    <div>
                        <label>من اليمين (Right px):</label>
                        <input type="number" id="logoRight" value="10" oninput="updateLogo()">
                    </div>
                    <div>
                        <label>حجم اللوجو (Width px):</label>
                        <input type="number" id="logoWidth" value="80" oninput="updateLogo()">
                    </div>
                </div>

                <div class="controls-grid" style="max-width:200px; margin: 10px auto;">
                    <div></div>
                    <button class="btn btn-dark" onclick="moveLogo('top', -5)">⬆️</button>
                    <div></div>
                    <button class="btn btn-dark" onclick="moveLogo('right', 5)">⬅️</button>
                    <button class="btn btn-dark" onclick="moveLogo('top', 5)">⬇️</button>
                    <button class="btn btn-dark" onclick="moveLogo('right', -5)">➡️</button>
                </div>

                <button class="btn btn-pink" onclick="saveLogoToFirebase()">حفظ مكان اللوجو وتطبيقه في التطبيق</button>
            </div>
        </div>

        <div>
            <!-- إضافة روابط قائمة التشغيل -->
            <div class="card">
                <div class="card-title">➕ إضافة فيديو / فيلم للقائمة المتتالية</div>
                <input type="text" id="videoTitle" placeholder="اسم الفيديو / الفيلم">
                <input type="text" id="videoUrl" placeholder="رابط الفيديو المباشر (MP4 / M3U8)">
                <button class="btn btn-pink" onclick="addToPlaylist()">إضافة للقائمة</button>
            </div>

            <!-- إدارة الإعلانات الفورية -->
            <div class="card card-wine">
                <div class="card-title">📢 قطع البث وإعادة إكمال الفيديو (إعلان عاجل)</div>
                <input type="text" id="adUrl" placeholder="رابط فيديو الإعلان (MP4)">
                <button class="btn btn-pink" onclick="playAdNow()">⚡ بث الإعلان الآن (حفظ دقيقة الفيلم)</button>
            </div>

            <!-- قائمة التشغيل المتتالية -->
            <div class="card">
                <div class="card-title">📜 قائمة التشغيل المتتالية (Auto-Play Next)</div>
                <ul class="playlist-box" id="playlistUI"></ul>
            </div>
        </div>
    </div>
</div>

<script>
    // 🔴 1. اكتب بيانات Firebase الخاصة بمشروعك هنا لربط السيرفر بالكامل
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "...",
        appId: "..."
    };

    if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
        firebase.initializeApp(firebaseConfig);
        window.db = firebase.firestore();
    }

    const video = document.getElementById('liveVideo');
    const logo = document.getElementById('overlayLogo');
    
    let playlist = [];
    let currentIndex = 0;
    let savedMovieTime = 0;
    let isPlayingAd = false;

    // تشغيل الفيديو التالي تلقائياً عند انتهاء الفيديو الحالي
    video.onended = function() {
        if (isPlayingAd) {
            // انتهى الإعلان -> عُد للفيلم من نفس المكان!
            isPlayingAd = false;
            alert("انتهى الإعلان! جاري استكمال الفيلم من نقطة التوقف...");
            playCurrentMovie(savedMovieTime);
        } else {
            // انتهى الفيلم -> شغل الفيلم التالي في القائمة تلقائياً
            if (currentIndex + 1 < playlist.length) {
                currentIndex++;
                playCurrentMovie(0);
            }
        }
    };

    function addToPlaylist() {
        const title = document.getElementById('videoTitle').value;
        const url = document.getElementById('videoUrl').value;
        if (!url) return alert('ادخل رابط الفيديو!');

        playlist.push({ title: title || "فيديو " + (playlist.length + 1), url: url });
        document.getElementById('videoTitle').value = '';
        document.getElementById('videoUrl').value = '';
        
        renderPlaylist();

        // لو كان أول فيديو، نشغله فوراً
        if (playlist.length === 1 && !isPlayingAd) {
            playCurrentMovie(0);
        }
    }

    function renderPlaylist() {
        const ui = document.getElementById('playlistUI');
        ui.innerHTML = '';
        playlist.forEach((item, index) => {
            ui.innerHTML += `
                <li class="playlist-item ${index === currentIndex ? 'active-movie' : ''}">
                    <span>${index + 1}. ${item.title}</span>
                    <div>
                        <button class="btn btn-pink" style="padding:2px 6px; font-size:11px;" onclick="playSelect(${index})">تشغيل</button>
                        <button class="btn btn-wine" style="padding:2px 6px; font-size:11px;" onclick="removeItem(${index})">حذف</button>
                    </div>
                </li>
            `;
        });
    }

    function playCurrentMovie(startTime = 0) {
        if (playlist.length === 0) return;
        const current = playlist[currentIndex];
        video.src = current.url;
        video.currentTime = startTime;
        video.play();
        document.getElementById('nowPlayingText').innerText = "شغال الآن: " + current.title;
        renderPlaylist();
        syncStateToFirebase(current.url, current.title, false, startTime);
    }

    function playSelect(index) {
        currentIndex = index;
        isPlayingAd = false;
        playCurrentMovie(0);
    }

    function removeItem(index) {
        playlist.splice(index, 1);
        renderPlaylist();
    }

    function playAdNow() {
        const adUrl = document.getElementById('adUrl').value || "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4";
        
        // حفظ الوقت الحالي للفيلم
        savedMovieTime = video.currentTime;
        isPlayingAd = true;

        video.src = adUrl;
        video.play();
        document.getElementById('nowPlayingText').innerText = "📢 عاجل: بث إعلان تجاري...";
        
        syncStateToFirebase(adUrl, "إعلان عاجل", true, 0);
    }

    /* تحكم اللوجو بالأسهم والبكسل */
    function updateLogo() {
        const url = document.getElementById('logoUrl').value;
        const top = document.getElementById('logoTop').value;
        const right = document.getElementById('logoRight').value;
        const width = document.getElementById('logoWidth').value;

        if (url) logo.src = url;
        logo.style.top = top + 'px';
        logo.style.right = right + 'px';
        logo.style.width = width + 'px';
    }

    function moveLogo(dir, value) {
        if (dir === 'top') {
            const el = document.getElementById('logoTop');
            el.value = parseInt(el.value) + value;
        } else if (dir === 'right') {
            const el = document.getElementById('logoRight');
            el.value = parseInt(el.value) + value;
        }
        updateLogo();
    }

    function syncStateToFirebase(url, title, isAd, seek) {
        if (window.db) {
            window.db.collection("tv_channel").doc("current_state").set({
                currentUrl: url,
                title: title,
                isAd: isAd,
                seekTime: seek,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        }
    }

    function saveLogoToFirebase() {
        if (window.db) {
            window.db.collection("tv_channel").doc("logo_settings").set({
                url: document.getElementById('logoUrl').value,
                top: document.getElementById('logoTop').value,
                right: document.getElementById('logoRight').value,
                width: document.getElementById('logoWidth').value
            }).then(() => alert("تم حفظ إعدادات مكان اللوجو بنجاح!"));
        } else {
            alert("تنبيه: يلزم حط بيانات firebaseConfig الخاصة بك في الكود أولاً لربط الفايربيس!");
        }
    }
</script>
</body>
</html>
